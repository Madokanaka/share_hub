databaseChangeLog:
  - changeSet:
      id: 001 users
      author: Seitek
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(50)
                  defaultValue: USER

  - changeSet:
      id: 002 categories
      author: Seitek
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true

  - changeSet:
      id: 003 files
      author: Seitek
      changes:
        - createTable:
            tableName: files
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: filename
                  type: VARCHAR(255)
              - column:
                  name: is_public
                  type: BOOLEAN
              - column:
                  name: download_key
                  type: VARCHAR(255)
              - column:
                  name: download_count
                  type: INT
                  defaultValueNumeric: 0
              - column:
                  name: upload_date
                  type: TIMESTAMP
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_file
                    references: users(id)
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_category_file
                    references: categories(id)


